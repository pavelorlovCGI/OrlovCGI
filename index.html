<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Портфолио</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Montserrat', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      line-height: 1.6;
      scroll-behavior: smooth;
    }
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
    }
    .logo {
      font-weight: 700;
      font-size: 1.5rem;
    }
    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      transition: opacity 0.3s;
      cursor: pointer;
    }
    .nav-links a:hover {
      opacity: 0.7;
    }
    .menu-btn {
      display: none;
      background: none;
      border: none;
      color: #fff;
      font-size: 1.8rem;
      cursor: pointer;
    }
    section {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 100px 20px 60px;
      text-align: center;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
    }
    h2 {
      font-size: 2.2rem;
      margin-bottom: 30px;
    }
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: all 0.8s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      justify-content: center;
      margin-top: 40px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border-radius: 15px;
      padding: 30px;
      width: 280px;
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: default;
    }
    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    .card h3 {
      margin-bottom: 10px;
    }
    .card img {
      margin-bottom: 10px;
    }
    .contacts a {
      color: #fff;
      text-decoration: underline;
      margin: 0 10px;
    }
    /* Скрытые карточки (остаются в DOM для галереи) */
    .hidden-card {
      display: none;
    }
    /* Lightbox */
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 999;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    #lightbox-img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }
    .lightbox-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: #fff;
      font-size: 3rem;
      cursor: pointer;
      user-select: none;
      padding: 10px;
      background: rgba(0,0,0,0.5);
      border-radius: 5px;
    }
    .lightbox-nav:hover {
      background: rgba(0,0,0,0.8);
    }
    .lightbox-prev {
      left: 20px;
    }
    .lightbox-next {
      right: 20px;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      user-select: none;
    }
    @media (max-width: 768px) {
      .menu-btn {
        display: block;
      }
      .nav-links {
        display: none;
        flex-direction: column;
        position: absolute;
        top: 60px;
        right: 30px;
        background: rgba(0,0,0,0.8);
        padding: 20px;
        border-radius: 10px;
      }
      .nav-links.active {
        display: flex;
      }
      h1 { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <!-- Lightbox для галереи -->
  <div id="lightbox" onclick="closeLightbox()">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <span class="lightbox-nav lightbox-prev" onclick="changeImage(-1)">&#8249;</span>
    <img id="lightbox-img" src="" alt="lightbox">
    <span class="lightbox-nav lightbox-next" onclick="changeImage(1)">&#8250;</span>
  </div>

  <nav>
    <div class="logo">Портфолио</div>
    <button class="menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('active')">☰</button>
    <ul class="nav-links">
      <li><a href="#about">О себе</a></li>
      <li><a href="#works" onclick="openWorksGallery()">Мои работы</a></li>
      <li><a href="#contacts">Контакты</a></li>
    </ul>
  </nav>

  <section id="about" class="fade-in">
    <h1>Привет, я Павел</h1>
    <p>3D artist, Texture (shading) artist.</p>
  </section>

  <section id="works" class="fade-in">
    <h2>Мои работы</h2>
    <div class="cards">
      <!-- Видимая карточка -->
      <div class="card">
        <h3>Рейхстаг</h3>
        <p>Texturing, Shading, Lighting</p>
        <img src="1-compressed.png" alt="Общий план" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('1-compressed.png')">
        <img src="2-compressed.png" alt="Постановка в кадре" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('2-compressed.png')">
        <img src="3-compressed.png" alt="Ближний план" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('3-compressed.png')">
        <img src="reichstag3-compressed.png" alt="Референсное изображение локации" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('reichstag3-compressed.png')">
      </div>
      <!-- Скрытые карточки (доступны только в галерее) -->
      <div class="card hidden-card">
        <h3>Пропсы</h3>
        <p>Texturing</p>
        <img src="1.jpg" alt="Turkish_woman_dress" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('1.jpg')">
        <img src="2.jpg" alt="Turkish_woman_dress_2" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('2.jpg')">
        <img src="3.jpg" alt="Turkish_woman_dress_3" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('3.jpg')">
        <img src="5.jpg" alt="Industrial_tower" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('5.jpg')">
        <img src="azat_horse_shade_001-compressed.png" alt="Horse_1" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('azat_horse_shade_001-compressed.png')">
        <img src="bulat_horse_shade_001-compressed.png" alt="Horse_2" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('bulat_horse_shade_001-compressed.png')">
        <img src="shaimuratov_horse_shade_001-compressed.png" alt="Horse_3" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('shaimuratov_horse_shade_001-compressed.png')">
        <img src="ural_horse_shade_001-compressed.png" alt="Horse_4" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('ural_horse_shade_001-compressed.png')">
        <img src="yulai_horse_shade_001-compressed.png" alt="Horse_5" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('yulai_horse_shade_001-compressed.png')">
        <img src="p1.PNG" alt="Pilot_uniform" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('p1.PNG')">
        <img src="p3.PNG" alt="Pilot_uniform_2" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('p3.PNG')">
        <img src="p4.PNG" alt="Pilot_uniform_3" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('p4.PNG')">
        <img src="p5.PNG" alt="Pilot_uniform_4" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('p5.PNG')">
      </div>
      <div class="card hidden-card">
        <h3>Lighting and Render</h3>
        <p></p>
        <img src="363170.png" alt="CloseUp" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('363170.png')">
        <img src="ep015_sc003_sh210_comp_v001.png" alt="DayShot" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('ep015_sc003_sh210_comp_v001.png')">
        <img src="ep023_sc001_sh140_comp_v004.0001.png" alt="NightShot" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('ep023_sc001_sh140_comp_v004.0001.png')">
        <img src="ep029_sc002_sh070_comp_v001.0103.png" alt="SoftLight" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('ep029_sc002_sh070_comp_v001.0103.png')">
        <img src="ep035_sc001_sh200_comp_v001.01.png" alt="FireLight" style="width:100%; border-radius:10px; cursor:pointer;" onclick="openLightbox('ep035_sc001_sh200_comp_v001.01.png')">
      </div>
    </div>
  </section>

  <section id="contacts" class="fade-in">
    <h2>Контакты</h2>
    <p>Email: <a href="mailto:orlovpavel23@mail.ru">orlovpavel23_mail.ru</a></p>
    <p>Telegram: @folkonebass</p>
  </section>

  <script>
    // Глобальный массив всех изображений из раздела works
    let galleryImages = [];
    let currentIndex = 0;

    // Функция для сбора всех изображений из #works (включая скрытые)
    function collectWorksImages() {
      const imgs = document.querySelectorAll('#works .card img');
      galleryImages = Array.from(imgs).map(img => img.src);
    }

    // Открыть галерею всех работ (вызывается из меню)
    function openWorksGallery() {
      collectWorksImages();
      if (galleryImages.length === 0) return;
      currentIndex = 0;
      showImage(currentIndex);
      document.getElementById('lightbox').style.display = 'flex';
    }

    // Открыть lightbox с конкретным изображением
    function openLightbox(src) {
      collectWorksImages();
      const idx = galleryImages.indexOf(src);
      currentIndex = idx !== -1 ? idx : 0;
      showImage(currentIndex);
      document.getElementById('lightbox').style.display = 'flex';
    }

    function closeLightbox() {
      document.getElementById('lightbox').style.display = 'none';
    }

    function showImage(index) {
      const img = document.getElementById('lightbox-img');
      img.src = galleryImages[index];
    }

    function changeImage(direction) {
      currentIndex = (currentIndex + direction + galleryImages.length) % galleryImages.length;
      showImage(currentIndex);
    }

    // Закрытие по Escape, навигация стрелками
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') changeImage(-1);
      if (e.key === 'ArrowRight') changeImage(1);
    });

    // Сбор изображений при загрузке
    collectWorksImages();

    // Анимация появления при скролле
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.2 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));

    // Плавный скролл по якорям (кроме #works)
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        if (this.getAttribute('href') === '#works') return;
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth' });
        }
        document.querySelector('.nav-links').classList.remove('active');
      });
    });
  </script>
</body>
</html>
